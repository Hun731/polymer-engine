repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Formatting is advisory here; ruff check is the gate.
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7, types-PyYAML]
        args: [--ignore-missing-imports]
        files: ^src/

  - repo: local
    hooks:
      - id: no-network-in-core-tests
        name: core tests must not reach the network
        entry: pytest tests/unit tests/providers tests/security -q
        language: system
        pass_filenames: false
        stages: [pre-push]
