<html><body><h1>Polymer Builder</h1>
<form><table>
<tr><td><label for="mon">Monomer</label></td><td><select id="mon" name="monomer">
<option value="">-- choose --</option><option value="PE">Polyethylene</option>
<option value="PLA">Poly(lactic acid)</option></select></td></tr>
<tr><td>Degree of polymerization</td><td><input id="dp" name="dp" type="number" maxlength="1"></td></tr>
<tr><td><label for="nc">Number of chains</label></td><td><input id="nc" name="nchain" type="number"></td></tr>
</table><button type="button" id="next">Build</button></form>
<script>
// A form that silently clamps DP to a single digit -- the exact failure that produces
// a valid-looking system for a different polymer.
document.getElementById('dp').addEventListener('input', function(){
  if (this.value.length > 1) this.value = this.value.slice(0,1); });
document.getElementById('next').addEventListener('click', function(){
  document.body.innerHTML = '<h1>Job submitted</h1><p>jobid=9911223</p>'; });
</script></body></html>
