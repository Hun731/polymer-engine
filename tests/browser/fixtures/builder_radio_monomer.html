<html><body><h1>Polymer Builder</h1>
<!-- Monomers offered as radio buttons, not a <select>. The original discovery code
     scanned only <select> and would report zero monomers for this page. -->
<form><fieldset><legend>Monomer</legend>
<label><input type="radio" name="monomer" value="PE"> Polyethylene</label>
<label><input type="radio" name="monomer" value="PLA"> Poly(lactic acid)</label>
<label><input type="radio" name="monomer" value="PS"> Polystyrene</label>
</fieldset><table>
<tr><td>Degree of polymerization</td><td><input id="dp" name="dp" type="number" required></td></tr>
<tr><td><label for="nc">Number of chains</label></td><td><input id="nc" name="nchain" type="number"></td></tr>
</table><button type="button" id="next">Next Step</button></form></body></html>
