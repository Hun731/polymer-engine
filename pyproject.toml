[project]
name = "polymer-autonomous-engine"
version = "0.7.0"
description = "Reproducible orchestration engine for computational polymer discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.0",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Scientific extras. The core engine and its test suite run without these; every
# module that needs one degrades to an explicit UNSUPPORTED result rather than failing.
chem = ["rdkit>=2023.9"]
md = ["MDAnalysis>=2.7"]
ml = ["scikit-learn>=1.4", "scipy>=1.11", "pandas>=2.0"]
agent = ["anthropic>=0.40"]
science = [
  "rdkit>=2023.9",
  "MDAnalysis>=2.7",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pandas>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
polymer-engine = "polymer_engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymer_engine"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "requires_gromacs: needs a real gmx executable",
  "requires_orca: needs a real orca executable",
  "requires_plumed: needs a real plumed executable",
  "requires_rdkit: needs RDKit installed",
  "requires_mdanalysis: needs MDAnalysis installed",
  "requires_sklearn: needs scikit-learn installed",
  "slow: takes more than a second",
  "requires_browser: needs the isolated .browserenv with Playwright",
  "live: talks to a live external service; opt-in only, never in ordinary CI",
]
filterwarnings = [
  "ignore::UserWarning:MDAnalysis.*",
  "ignore::PendingDeprecationWarning:MDAnalysis.*",
  "ignore::DeprecationWarning:MDAnalysis.*",
]

[tool.coverage.run]
source = ["src/polymer_engine"]
branch = true
omit = ["*/providers/testing.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "PTH",  # prefer pathlib
  "ARG",  # unused arguments
  "TRY",  # exception antipatterns
  "BLE",  # blind except
]
ignore = [
  "E501",    # line length is enforced by the formatter
  "TRY003",  # long messages inside raise are deliberate here; they are the diagnostics
  "TRY300",  # return-in-try reads better than the else-block alternative in places
  "B008",    # typer uses call-in-default for options by design
  "SIM108",  # ternaries are not always clearer
  # `class X(str, Enum)` is deliberate: it keeps JSON/pydantic round-trips stable and
  # lets existing comparisons against plain strings keep working.  StrEnum would be a
  # behavioural change, not a cleanup.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "BLE", "TRY", "B011", "SIM"]
# Provider factories share one (config, client) signature; some do not need the config.
"src/polymer_engine/providers/registry.py" = ["ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["polymer_engine"]

[tool.mypy]
# No explicit python_version: mypy uses the running interpreter, which keeps it
# consistent with the NumPy stubs actually installed (they require 3.12+ syntax).
files = ["src/polymer_engine"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional scientific dependencies ship without complete type information.  RDKit in
# particular exposes many of its functions dynamically, so its module attributes are
# not statically declared; those calls are covered by tests instead.
module = ["rdkit.*", "MDAnalysis.*", "sklearn.*", "scipy.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# RDKit populates Descriptors/Lipinski/Crippen attributes at import time, so static
# analysis cannot see them.  Those call sites are covered by numeric tests instead.
module = [
  "polymer_engine.polymer.descriptors",
  "polymer_engine.polymer.identity",
  "polymer_engine.polymer.taxonomy",
  "polymer_engine.discovery.candidates",
  "polymer_engine.simulation.melt_builder",
]
disable_error_code = ["attr-defined"]
